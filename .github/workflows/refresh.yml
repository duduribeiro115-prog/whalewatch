name: Daily 13F refresh

# Runs every day at 09:00 UTC, and can be triggered manually from the Actions tab.
# It pulls any new 13F filings from SEC, commits the updated database back to the
# repo, and that commit auto-deploys to Render — so the live site stays current
# and the data persists in git (no paid disk needed).
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install flask requests
      - name: Refresh holdings from SEC EDGAR
        env:
          SEC_UA: "WhaleWatch/1.0 (Eduardo Ribeiro eduardoribeiro@uchicago.edu)"
        run: python whalewatch.py refresh
      - name: Commit updated database (if anything changed)
        run: |
          git config user.name "whalewatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add whalewatch.db
          if git diff --staged --quiet; then
            echo "No new filings today — nothing to commit."
          else
            git commit -m "Daily 13F refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
